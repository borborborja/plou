name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Servidor y PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck --workspace=server
      - run: npm run typecheck --workspace=web
      - run: npm run build
      - name: Comprobar que las tablas generadas están al día
        run: |
          node scripts/gen-color-table.mjs
          node scripts/gen-color-table-kotlin.mjs
          git diff --exit-code
      - run: npm audit --audit-level=high
      - run: docker compose config --quiet

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Análisis estático
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
      - name: Compilar APK de depuración
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
