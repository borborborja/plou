name: Imagen Docker

# Se publica una imagen por release y otra por cada empujón a `main`, para que
# siempre haya una imagen reciente sin esperar a la siguiente versión.
on:
  release:
    types: [published]
  push:
    branches: [main]
    # Cambiar la app Android no cambia la imagen del servidor.
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Plou
            org.opencontainers.image.description=Avisos de lluvia por radar meteorológico y previsión detallada
            org.opencontainers.image.licenses=MIT

      # Primero se construye en local para poder probarla antes de publicarla.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que arranca y responde
        run: |
          # Una imagen que no levanta no debe llegar al registro.
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name plou-check -p 8787:8787 "$TAG"

          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/health || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done

          echo "· salud:  $(curl -s http://127.0.0.1:8787/api/health)"
          for RUTA in / /api/meta /api/radar/frames; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787$RUTA" || true)
            echo "· $RUTA → $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::$RUTA ha respondido $CODE"
              docker logs plou-check | tail -40
              docker rm -f plou-check
              exit 1
            fi
          done
          docker rm -f plou-check

      - name: Publicar en el registro
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo '## Imagen publicada'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo 'Para desplegarla:'
            echo
            echo '```bash'
            echo "docker run -d --name plou -p 8787:8787 \\"
            echo "  -v /opt/dades/plou:/app/server/data \\"
            echo "  ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
